        if: steps.changes.outputs.backend_changed == 'true'
        run: npx vitest run --shard=2/2 --maxWorkers=4 --exclude "tests/test_ui/**" --exclude "tests/test_workerd/**"
      - name: Skip backend tests when irrelevant
        if: steps.changes.outputs.backend_changed != 'true'
        run: echo "No backend-relevant changes detected; backend tests skipped."

  test:
    runs-on: ubuntu-24.04-arm
    needs: [test-shard-1, test-shard-2]
    if: always()
    steps:
      - name: Verify backend test shards
        env:
          SHARD_1_RESULT: ${{ needs.test-shard-1.result }}
          SHARD_2_RESULT: ${{ needs.test-shard-2.result }}
        run: |
          echo "test-shard-1 result: $SHARD_1_RESULT"
          echo "test-shard-2 result: $SHARD_2_RESULT"
          if [[ "$SHARD_1_RESULT" == "success" && "$SHARD_2_RESULT" == "success" ]]; then
            exit 0
          fi
          echo "One or more backend test shards failed, were cancelled, or were skipped unexpectedly."
          exit 1

  workerd:
    runs-on: arm-4core
    steps:
      - name: Detect backend-relevant changes
        id: changes
        uses: actions/github-script@v9
        with:
