name: Deploy Docs
on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA to deploy to docs.trycycloid.com
        required: true
        default: main
permissions:
  contents: read
concurrency:
  group: deploy-docs
  cancel-in-progress: true
jobs:
  deploy-docs:
    name: Deploy Docs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler pages deploy apps/docs \
            --project-name=cycloid-docs \
            --branch=main
