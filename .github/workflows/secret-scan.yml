name: Secret scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# PR runs cancel superseded runs to save Actions minutes on rapid force-pushes.
# main-branch push scans must NEVER be cancelled: a newer merge cannot drop the
# scan of an earlier commit. github.sha makes each main commit its own group,
# and cancel-in-progress is gated to pull_request events as belt-and-suspenders.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_arm64.tar.gz | tar xz
          sudo mv gitleaks /usr/local/bin/
      - name: Scan for secrets
        run: gitleaks detect --source . --verbose --log-opts="${{ github.event_name == 'pull_request' && format('{0}...{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}^...{1}', github.event.before, github.event.after) }}"
