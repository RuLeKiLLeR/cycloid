name: Infra freshness check

on:
  pull_request:
    branches: [main]
    paths: ["infra/**"]

jobs:
  infra-freshness:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure branch includes latest main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::Branch is behind main. Rebase onto main before merging infra changes to ensure the Terraform plan is accurate."
            exit 1
          fi
