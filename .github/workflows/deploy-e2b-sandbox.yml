name: Deploy E2B Sandbox
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA to deploy to production E2B
        required: true
        default: main
      force_rebuild:
        description: Bypass content-hash skip and rebuild every production E2B template
        required: false
        type: boolean
        default: false
      notify_slack:
        description: Send a Slack notification for this deploy
        required: false
        type: boolean
        default: true
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    name: Deploy
    uses: ./.github/workflows/deploy-e2b-sandbox-core.yml
    permissions:
      contents: read
      id-token: write
    with:
      ref: ${{ inputs.ref }}
      environment: production
      force_rebuild: ${{ inputs.force_rebuild }}
      notify_slack: ${{ inputs.notify_slack }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
